<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Три робота — логическая игра</title>
  <meta name="description" content="Один робот всегда говорит правду, другой всегда врёт, третий отвечает наугад. Найдите шестерёнку и вычислите, кто есть кто.">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f3efe6; --card: #fffdf8; --ink: #1d1b2c; --muted: #6e6a80; --line: #e2dccd; --truth: #1f9d6b; --liar: #e0453a; --rand: #8a5cf6; color-scheme: light; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; background: var(--bg) radial-gradient(circle at 1px 1px, rgba(29, 27, 44, 0.07) 1px, transparent 0) 0 0 / 22px 22px; color: var(--ink); font: 16px/1.45 Onest, system-ui, sans-serif; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app { max-width: 820px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .top h1 { margin: 0; font: 800 22px Unbounded, sans-serif; }
    .top .chip { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
    .top .sp { margin-left: auto; }
    .task { margin: 0 0 16px; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 500; }
    .task b { color: #ffd76a; }
    .bots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
    .bot { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); }
    .bot__head { display: flex; align-items: center; gap: 12px; }
    .robo { position: relative; flex: none; width: 58px; height: 50px; border-radius: 14px; background: var(--c); margin-top: 12px; }
    .robo::before { content: ''; position: absolute; left: 50%; top: -14px; width: 3px; height: 12px; margin-left: -1.5px; background: var(--ink); }
    .robo::after { content: ''; position: absolute; left: 50%; top: -20px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--c); border: 2px solid var(--ink); }
    .robo i { position: absolute; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: blink 4s infinite; }
    .robo i::after { content: ''; position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
    .robo i:first-child { left: 10px; } .robo i:nth-child(2) { right: 10px; }
    .robo b { position: absolute; left: 18px; right: 18px; bottom: 9px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.35); }
    @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
    .bot__name { font: 800 18px Unbounded, sans-serif; }
    .say { position: relative; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--bg); font-weight: 500; }
    .say .mark { float: right; margin-left: 6px; font-weight: 800; }
    .say.t .mark { color: var(--truth); } .say.f .mark { color: var(--liar); }
    .roles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .roles button { flex: 1; min-width: 0; padding: 8px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; font-weight: 700; font-size: 13px; }
    .roles button.on[data-r=truth] { background: var(--truth); border-color: var(--truth); color: #fff; }
    .roles button.on[data-r=liar] { background: var(--liar); border-color: var(--liar); color: #fff; }
    .roles button.on[data-r=random] { background: var(--rand); border-color: var(--rand); color: #fff; }
    .roles.locked button { pointer-events: none; }
    .verdict { margin-top: 2px; font-weight: 800; font-size: 14px; }
    .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 14px; }
    .box { position: relative; padding: 14px 6px 12px; border: 2px solid var(--line); border-radius: 18px; background: var(--card); text-align: center; transition: transform 0.15s, border-color 0.15s; }
    .box span { display: block; font-size: 44px; line-height: 1.1; }
    .box b { font: 800 14px Unbounded, sans-serif; }
    .box.sel { border-color: var(--ink); transform: translateY(-3px); box-shadow: 0 10px 20px -12px rgba(29, 27, 44, 0.6); }
    .box.win { border-color: var(--truth); background: #e9f8f1; }
    .box.miss { border-color: var(--liar); }
    .go { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font: 800 16px Unbounded, sans-serif; }
    .go:disabled { opacity: 0.35; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .hint { padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); font-weight: 700; }
    .msg { margin: 14px 0 0; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
    .msg.ok { border-color: var(--truth); } .msg.bad { border-color: var(--liar); }
    .intro { max-width: 560px; margin: 8vh auto 0; text-align: center; }
    .intro h1 { font: 800 clamp(32px, 9vw, 52px)/1.05 Unbounded, sans-serif; margin: 0 0 14px; }
    .intro .trio { display: flex; justify-content: center; gap: 22px; margin: 26px 0 10px; }
    .legend { display: grid; gap: 10px; margin: 18px 0 24px; text-align: left; }
    .legend div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; }
    .back { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(() => {
  const app = document.getElementById('app');
  const BOTS = [{ name: 'Болт', c: '#ffb238' }, { name: 'Винтик', c: '#4cc9f0' }, { name: 'Гайка', c: '#f472b6' }];
  const ROLE = { truth: 'Честный', liar: 'Лжец', random: 'Случайный' };
  const ROLE_COLOR = { truth: 'var(--truth)', liar: 'var(--liar)', random: 'var(--rand)' };
  const pick = (a) => a[Math.random() * a.length | 0];
  const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
  const nm = (i) => `<b style="color:${BOTS[i].c};filter:brightness(.8)">${BOTS[i].name}</b>`;

  let level = 1, lives = 3, hints = 3, best = 1, P = null, picked = null, guess = [], done = false, used = [];
  try { best = +localStorage.getItem('robots-best') || 1; } catch {}

  // все варианты мира: распределение ролей × ящик
  function worlds(n) {
    const roleSets = n === 2 ? [['truth', 'liar'], ['liar', 'truth']] : [['truth', 'liar', 'random'], ['truth', 'random', 'liar'], ['liar', 'truth', 'random'], ['liar', 'random', 'truth'], ['random', 'truth', 'liar'], ['random', 'liar', 'truth']];
    const out = []; for (const roles of roleSets) for (let box = 0; box < 3; box++) out.push({ roles, box });
    return out;
  }
  // шаблоны утверждений: текст + проверка на мире
  function makeStatement(n, self, said) {
    const others = [...Array(n).keys()].filter((i) => i !== self);
    const o = pick(others), x = Math.random() * 3 | 0, y = (x + 1 + (Math.random() * 2 | 0)) % 3;
    const list = [
      () => ({ text: `Шестерёнка в ящике ${x + 1}.`, ev: (w) => w.box === x }),
      () => ({ text: `В ящике ${x + 1} пусто.`, ev: (w) => w.box !== x }),
      () => ({ text: `Шестерёнка в ящике ${Math.min(x, y) + 1} или ${Math.max(x, y) + 1}.`, ev: (w) => w.box === x || w.box === y }),
      () => ({ text: `${nm(o)} — лжец.`, ev: (w) => w.roles[o] === 'liar' }),
      () => ({ text: `${nm(o)} всегда говорит правду.`, ev: (w) => w.roles[o] === 'truth' }),
      () => ({ text: `Если ${nm(o)} честный, то шестерёнка в ящике ${x + 1}.`, ev: (w) => w.roles[o] !== 'truth' || w.box === x }),
      () => ({ text: `Если я честный, то в ящике ${x + 1} пусто.`, ev: (w) => w.roles[self] !== 'truth' || w.box !== x }),
    ];
    if (n === 3) list.push(
      () => ({ text: `${nm(o)} отвечает наугад.`, ev: (w) => w.roles[o] === 'random' }),
      () => ({ text: `${nm(o)} точно не случайный.`, ev: (w) => w.roles[o] !== 'random' }),
    );
    const prev = said.filter((s) => s.by !== self);
    if (prev.length) { const s = pick(prev); list.push(() => ({ text: `${nm(s.by)} сказал правду.`, ev: (w) => s.ev(w) }), () => ({ text: `${nm(s.by)} соврал.`, ev: (w) => !s.ev(w) })); }
    return { ...pick(list)(), by: self };
  }
  function consistent(w, said) {
    return said.every((s) => w.roles[s.by] === 'random' || (w.roles[s.by] === 'truth') === s.ev(w));
  }
  function generate(lvl) {
    const n = lvl <= 4 ? 2 : 3;
    const per = lvl <= 2 ? 1 : lvl <= 8 ? 2 : pick([1, 2, 2]);
    const all = worlds(n);
    for (let tries = 0; tries < 5000; tries++) {
      const truth = pick(all);
      const said = [];
      for (let k = 0; k < per; k++) for (const b of shuffle([...Array(n).keys()])) {
        // утверждение должно соответствовать роли робота в настоящем мире
        for (let t = 0; t < 30; t++) {
          const s = makeStatement(n, b, said);
          const v = s.ev(truth), role = truth.roles[b];
          if ((role === 'truth' && v) || (role === 'liar' && !v) || (role === 'random' && Math.random() < 0.5)) { said.push(s); break; }
        }
      }
      if (said.length < n * per) continue;
      const ok = all.filter((w) => consistent(w, said));
      if (ok.length !== 1) continue;
      // слишком простые задачи (ответ виден из одной реплики) пропускаем
      const easy = said.some((s) => all.filter((w) => consistent(w, [s])).every((w) => w.box === truth.box));
      if (easy && Math.random() < 0.85) continue;
      return { n, truth, said };
    }
    return generate(Math.max(1, lvl - 1));
  }

  function newLevel() {
    P = generate(level); picked = null; done = false; used = [];
    guess = Array(P.n).fill(null);
    render();
  }

  function render(result) {
    const needRoles = level >= 3;
    const bots = [...Array(P.n).keys()];
    app.innerHTML = `
      <div class="top"><h1>🤖 Три робота</h1><span class="chip">Уровень ${level}</span><span class="chip sp">${'🔋'.repeat(lives)}${'🪫'.repeat(3 - lives)}</span><span class="chip">💡 ${hints}</span></div>
      <p class="task">${P.n === 2 ? 'Один робот всегда говорит <b>правду</b>, другой всегда <b>врёт</b>.' : 'Один всегда говорит <b>правду</b>, один всегда <b>врёт</b>, один отвечает <b>наугад</b>.'}
        Найдите шестерёнку${needRoles ? ' и отметьте, кто есть кто' : ''}.</p>
      <div class="bots">${bots.map((b) => `
        <div class="bot">
          <div class="bot__head"><div class="robo" style="--c:${BOTS[b].c}"><i></i><i></i><b></b></div><span class="bot__name">${BOTS[b].name}</span></div>
          ${P.said.filter((s) => s.by === b).map((s) => { const v = s.ev(P.truth); return `<div class="say ${done ? (v ? 't' : 'f') : ''}">${done ? `<span class="mark">${v ? '✓ правда' : '✗ ложь'}</span>` : ''}«${s.text}»</div>`; }).join('')}
          ${needRoles || done ? `<div class="roles ${done || used.includes(b) ? 'locked' : ''}">${Object.keys(ROLE).filter((r) => P.n === 3 || r !== 'random').map((r) => `<button data-b="${b}" data-r="${r}" class="${(done ? P.truth.roles[b] : guess[b]) === r ? 'on' : ''}">${ROLE[r]}</button>`).join('')}</div>` : ''}
          ${done && needRoles && guess[b] && guess[b] !== P.truth.roles[b] ? `<div class="verdict" style="color:var(--liar)">Вы отметили: ${ROLE[guess[b]]}</div>` : ''}
        </div>`).join('')}</div>
      <div class="boxes">${[0, 1, 2].map((i) => `<button class="box ${picked === i ? 'sel' : ''} ${done && i === P.truth.box ? 'win' : ''} ${done && picked === i && i !== P.truth.box ? 'miss' : ''}" data-box="${i}"><span>${done && i === P.truth.box ? '⚙️' : done ? '🫙' : '📦'}</span><b>Ящик ${i + 1}</b></button>`).join('')}</div>
      ${done ? `<div class="msg ${result.ok ? 'ok' : 'bad'}">${result.text}</div><div style="margin-top:12px"><button class="go" id="next">${lives > 0 ? (result.ok ? 'Следующий уровень →' : 'Новая загадка') : 'Начать заново'}</button></div>`
        : `<div class="row"><button class="go" id="check" ${picked === null || (needRoles && guess.some((g) => !g)) ? 'disabled' : ''}>Открыть ящик</button>${needRoles ? `<button class="hint" id="hint" ${hints ? '' : 'disabled'} title="Показать роль одного робота">💡</button>` : ''}</div>`}
      <a class="back" href="/">← Портфолио</a>`;

    app.querySelectorAll('[data-box]').forEach((b) => b.onclick = () => { if (done) return; picked = +b.dataset.box; render(); });
    app.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { if (done) return; guess[+b.dataset.b] = b.dataset.r; render(); });
    const check = document.getElementById('check');
    if (check) check.onclick = submit;
    const hint = document.getElementById('hint');
    if (hint) hint.onclick = () => {
      const unknown = [...Array(P.n).keys()].filter((b) => !used.includes(b));
      if (!unknown.length || !hints) return;
      const b = pick(unknown); used.push(b); hints--;
      guess[b] = P.truth.roles[b];
      render();
    };
    const next = document.getElementById('next');
    if (next) next.onclick = () => { if (lives <= 0) { level = 1; lives = 3; hints = 3; } newLevel(); };
  }

  function submit() {
    const needRoles = level >= 3;
    const boxOk = picked === P.truth.box;
    const rolesOk = !needRoles || guess.every((g, i) => g === P.truth.roles[i]);
    done = true;
    let text;
    if (boxOk && rolesOk) {
      text = `<b>Верно!</b> ${pick(['Железная логика.', 'Роботы в восхищении.', 'Шерлок одобряет.', 'Шестерёнка ваша.'])} Каждая реплика выше отмечена: правда или ложь.`;
      level++;
      if (level % 4 === 0 && hints < 3) { hints++; text += ' +1 подсказка 💡'; }
      if (level > best) { best = level; try { localStorage.setItem('robots-best', best); } catch {} }
    } else {
      lives--;
      text = `<b>${boxOk ? 'Ящик верный, но роли перепутаны.' : 'Мимо.'}</b> Посмотрите, кто на самом деле врал. `;
      text += lives > 0 ? 'Минус одна батарейка.' : `Батарейки сели. Вы дошли до уровня ${level}, рекорд — ${best}.`;
    }
    render({ ok: boxOk && rolesOk, text });
  }

  app.innerHTML = `<div class="intro">
    <div class="trio">${BOTS.map((b) => `<div class="robo" style="--c:${b.c};width:70px;height:60px"><i style="top:18px"></i><i style="top:18px"></i><b></b></div>`).join('')}</div>
    <h1>Три робота</h1>
    <p>Где-то в трёх ящиках спрятана шестерёнка. Роботы знают где, но говорят не всегда честно.</p>
    <div class="legend">
      <div><span class="dot" style="background:var(--truth)"></span><span><b>Честный</b> — каждая его фраза правдива.</span></div>
      <div><span class="dot" style="background:var(--liar)"></span><span><b>Лжец</b> — каждая его фраза ложна.</span></div>
      <div><span class="dot" style="background:var(--rand)"></span><span><b>Случайный</b> (с 5-го уровня) — говорит что попало.</span></div>
    </div>
    <p>Загадки генерируются заново каждый раз, и у каждой ровно одно решение — его проверяет встроенный решатель.</p>
    <button class="go" id="start">Начать</button>
    ${best > 1 ? `<p>Рекорд: уровень ${best}</p>` : ''}
    <a class="back" href="/">← Портфолио</a></div>`;
  document.getElementById('start').onclick = newLevel;
})();
</script>
</body>
</html>
